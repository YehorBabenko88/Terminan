[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-terminan"
version = "0.1.0"
description = "Independent read-only research terminal and offline paper strategy executor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The Math runtime is independently released/pinned by Unified; this extra is
# only a development convenience, never an implicit exchange/network provider.
math = ["unified-math-kernels==0.1.0"]

[project.scripts]
terminan = "terminan.server:run"

[tool.setuptools]
packages = ["terminan"]
include-package-data = false

[tool.setuptools.package-data]
terminan = ["*.html", "*.md"]
