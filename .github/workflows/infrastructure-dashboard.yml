name: infrastructure-dashboard
on: [push, pull_request]
jobs:
  dashboard:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_infrastructure.py
      - run: npx playwright test --config playwright.infrastructure.config.cjs
      - shell: pwsh
        run: |
          @{schema='five.ci.v1';head=(git rev-parse HEAD);tree=(git rev-parse 'HEAD^{tree}');run='${{ github.run_id }}';attempt='${{ github.run_attempt }}';source='SYNTHETIC_DISPOSABLE_SOFTWARE_TEST';physical='NOT_RUN';production='NO_GO'} | ConvertTo-Json | Set-Content five-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-${{ matrix.os }}
          path: five-evidence.json
