name: Unified runtime exact offline
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: unified-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    env:
      PYTHONPATH: ${{ github.workspace }}/unified-source-guard
      TERMINAN_TEST_UNIFIED_ROOT: ${{ github.workspace }}/unified-source-guard
    steps:
      - name: Pinned shared source-verifier test fixture
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/unified-system
          ref: 697c0bf546274162942d6b6254168f4df9d0e72c
          path: unified-source-guard
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: d537d525296ef34f727996e240ae6c60102c6082
          path: grid
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/strattester
          ref: 37ff7e9d12a4d2dccd788fc493c28557dbe8bcea
          path: strattester
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: python -m unittest discover -s tests -q
      - run: node tests/check_cache_race.cjs
      - run: node tests/check_r4_protocol.cjs
      - run: node tests/check_ui_script.cjs
      - run: node tests/check_ui_refresh_race.cjs
      - name: Exact native Windows 15 then600
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha=git rev-parse HEAD
          powershell.exe -NoProfile -File scripts/Invoke-Terminan.ps1 -ExpectedSha $sha -ReviewSeconds 15 -EvidenceRoot reports/unified15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/Invoke-Terminan.ps1 -ExpectedSha $sha -ReviewSeconds 600 -PreviousSmoke reports/unified15 -EvidenceRoot reports/unified600
          exit $LASTEXITCODE
      - name: Exact Linux 15 then600
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m terminan.unified_harness --sha "$(git rev-parse HEAD)" --out reports/unified15 --seconds 15
          python -m terminan.unified_harness --sha "$(git rev-parse HEAD)" --out reports/unified600 --seconds 600 --previous reports/unified15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-${{ matrix.os }}-${{ github.run_attempt }}
          path: candidate/reports/
