name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  TERMINAN_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TERMINAN_TEST_SHA }}
          persist-credentials: false
      - name: Verify Terminan source SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Terminan source: $actual"
          test "$actual" = "$TERMINAN_TEST_SHA"
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/math
          ref: 876b31f2310827d417e70ed22d0e9b5cfc9b5320
          path: upstream/math-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps ./upstream/math-sdk
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q terminan

  paper-source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TERMINAN_TEST_SHA }}
          persist-credentials: false
      - name: Verify Terminan source SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Terminan source: $actual"
          test "$actual" = "$TERMINAN_TEST_SHA"
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/meta_analyse
          ref: 9d0fb5c79a5da13b23f8daa066035b09f676a6fc
          path: upstream/meta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/math
          ref: 98d6783522aac7155cbb4635e5b29239746d88e0
          path: upstream/math
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps ./upstream/math
      - run: python tests/check_paper_source_parity.py

  wheel-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TERMINAN_TEST_SHA }}
          persist-credentials: false
      - name: Verify Terminan source SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Terminan source: $actual"
          test "$actual" = "$TERMINAN_TEST_SHA"
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 67969e4aa99f2a07b8273379ea9b3a0bfa3d1311
          path: upstream/grid-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/math
          ref: 876b31f2310827d417e70ed22d0e9b5cfc9b5320
          path: upstream/math-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build independent Terminan wheel
        shell: bash
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel outside source checkout
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/terminan-check" dist/*.whl
          python -c "import os,subprocess,sys,tempfile; env=os.environ.copy(); env['PYTHONPATH']=os.path.join(os.environ['RUNNER_TEMP'],'terminan-check'); code='from importlib.resources import files; import terminan; from terminan.paper import PaperEngine; from terminan.server import Handler; assert terminan.__version__==\"0.1.0\"; assert files(\"terminan\").joinpath(\"index.html\").is_file(); assert files(\"terminan\").joinpath(\"monitor.html\").is_file(); assert PaperEngine().enabled is False; print(\"INSTALLED_TERMINAN=PASS\")'; subprocess.run([sys.executable,'-c',code],env=env,cwd=tempfile.mkdtemp(),check=True)"

      - name: Check installed Grid and Math compatibility
        shell: bash
        run: |
          export TERMINAN_COHORT_PATH="$RUNNER_TEMP/terminan-check"
          python -m pip install --no-deps --target "$TERMINAN_COHORT_PATH" ./upstream/grid-sdk ./upstream/math-sdk
          python -I tests/check_installed_grid_levels.py

  grid-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TERMINAN_TEST_SHA }}
          persist-credentials: false
      - name: Verify Terminan source SHA
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Terminan source: $actual"
          test "$actual" = "$TERMINAN_TEST_SHA"
      - name: Install exact Playwright test package (no browser download)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Test source-quality UI in a real browser
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v chromium)"
          else
            echo "Chromium/Chrome unavailable; browser qualification cannot pass"
            exit 1
          fi
          node --test tests/browser/test_grid_source.cjs
