name: R4 exact offline session candidate
on: [push, pull_request]
concurrency:
  group: terminan-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: d537d525296ef34f727996e240ae6c60102c6082
          path: grid
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/strattester
          ref: 37ff7e9d12a4d2dccd788fc493c28557dbe8bcea
          path: strattester
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact run identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'SHA mismatch' }
          if ('${{ github.event_name }}' -eq 'pull_request' -and '${{ github.event.pull_request.base.sha }}' -ne 'a2019e83d456ef2b6b2d52608b26322b36d402e3') { throw 'Saved-data stack base drift' }
          @{candidate_sha=$sha;run_id='${{ github.run_id }}';attempt='${{ github.run_attempt }}';os='${{ matrix.os }}';python='${{ matrix.python }}'} | ConvertTo-Json | Set-Content reports/identity.json
      - name: Python contracts (failure retained)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> reports/python.txt
          $result=$LASTEXITCODE
          Get-Content reports/python.txt
          exit $result
      - name: Windows native PS5.1 propagation regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_harness_shells.py --shell powershell --report reports/harness-shell-ps51.json
      - name: Windows native PS7 propagation regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_harness_shells.py --shell pwsh --report reports/harness-shell-ps7.json
      - name: R3 Windows PS5.1 cancellation and false zero
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_r3_shells.py --shell powershell --report reports/r3-shell-ps51.json
      - name: R3 PS7 cancellation and false zero
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/test_r3_shells.py --shell pwsh --report reports/r3-shell-ps7.json
      - name: Actual Windows Ctrl+C cannot produce native zero
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_r3_console_cancel.py --report reports/r3-console-cancel.json
      - name: Linux actual owned-child lifecycle
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          python terminan/r2_harness.py --expected-sha (git rev-parse HEAD).Trim() --evidence-root .r2-evidence/linux --review-seconds 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m terminan.r2_evidence verify .r2-evidence/linux --sha (git rev-parse HEAD).Trim()
          exit $LASTEXITCODE
      - name: Real transport cancellation 15 second lifecycle
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/r3_transport_soak.py --expected-sha (git rev-parse HEAD).Trim() --seconds 15 --evidence-root .r3-reliability-evidence/short
      - name: Real transport cancellation 600 second lifecycle
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/r3_transport_soak.py --expected-sha (git rev-parse HEAD).Trim() --seconds 600 --evidence-root .r3-reliability-evidence/long
      - name: Verify transport lifecycle evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r2_evidence verify .r3-reliability-evidence --sha (git rev-parse HEAD).Trim()
      - name: R4 protocol finite retry contracts
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node tests/check_r4_protocol.cjs
      - name: R4 Windows PS5.1 native gate regressions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_r4_shells.py --shell powershell --report reports/r4-shell-ps51.json
      - name: R4 PS7 native gate regressions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/test_r4_shells.py --shell pwsh --report reports/r4-shell-ps7.json
      - name: R4 actual Windows console cancellation
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python scripts/test_r4_console_cancel.py --report reports/r4-console-cancel.json
      - name: R4 real15 session lifecycle
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r4_harness --expected-sha (git rev-parse HEAD).Trim() --review-seconds 15 --evidence-root .r4-reliability-evidence/short
      - name: R4 real600 session lifecycle
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r4_harness --expected-sha (git rev-parse HEAD).Trim() --review-seconds 600 --evidence-root .r4-reliability-evidence/long
      - name: UI syntax and cancellation contracts
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node tests/check_ui_script.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/check_ui_refresh_race.cjs
          exit $LASTEXITCODE
      - name: Compile
        if: ${{ !cancelled() }}
        run: python -m compileall -q terminan
      - name: Install pinned browser test dependencies
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
      - name: Install browser engines (Linux)
        timeout-minutes: 8
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: npx playwright install --with-deps chromium firefox
      - name: Install browser engines (Windows)
        timeout-minutes: 8
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: npx playwright install chromium firefox
      - name: Synthetic browser regressions (zero retries)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node node_modules/@playwright/test/cli.js test
          exit $LASTEXITCODE
      - name: Mandatory browser assertions and SHA256 evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r2_evidence bundle --report reports/r2-browser.json --out reports/r2-browser-evidence --sha (git rev-parse HEAD).Trim()
      - name: R3 measurable 10k and 100k browser workloads
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:R3_INVOCATION=[Guid]::NewGuid().ToString('N')
          "R3_INVOCATION=$env:R3_INVOCATION" >> $env:GITHUB_ENV
          node node_modules/@playwright/test/cli.js test --config=playwright.r3.config.cjs
          exit $LASTEXITCODE
      - name: R3 strict benchmark SHA256 evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r3_evidence --sha (git rev-parse HEAD).Trim() --out reports/r3-browser-evidence
      - name: R4 browser contracts performance and session stop
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:R4_INVOCATION=[Guid]::NewGuid().ToString('N')
          "R4_INVOCATION=$env:R4_INVOCATION" >> $env:GITHUB_ENV
          node node_modules/@playwright/test/cli.js test --config=playwright.r4.config.cjs
          exit $LASTEXITCODE
      - name: R4 strict browser SHA256 evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.r4_evidence --sha (git rev-parse HEAD).Trim() --out reports/r4-browser-evidence
      - name: Saved workspace browser regressions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:SAVED_INVOCATION=[guid]::NewGuid().ToString('N')
          $env:SAVED_STARTED_MS=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $env:R2_PYTHON=(Get-Command python).Source
          $env:SAVED_INVOCATION | Set-Content reports/saved-invocation.txt
          $env:SAVED_STARTED_MS | Set-Content reports/saved-started.txt
          node node_modules/@playwright/test/cli.js test --config=playwright.saved.config.cjs
          exit $LASTEXITCODE
      - name: Strict saved workspace evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python -m terminan.saved_evidence --report reports/saved-browser.json --sha (git rev-parse HEAD).Trim() --invocation (Get-Content reports/saved-invocation.txt).Trim() --started-ms (Get-Content reports/saved-started.txt).Trim() --out reports/saved-browser-evidence
      - name: R2 Windows PowerShell 5.1 harness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: ./scripts/Invoke-R2.ps1 -ExpectedSha (git rev-parse HEAD).Trim() -EvidenceRoot '.r2-evidence/ps51'
      - name: R2 Windows PowerShell 7 harness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/Invoke-R2.ps1 -ExpectedSha (git rev-parse HEAD).Trim() -EvidenceRoot '.r2-evidence/ps7'
      - name: Verify mandatory R2 harness evidence
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python -m terminan.r2_evidence verify .r2-evidence --sha (git rev-parse HEAD).Trim()
      - name: Windows PowerShell 5.1 harness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: ./scripts/Invoke-G0.ps1 -ExpectedSha (git rev-parse HEAD).Trim() -EvidenceRoot '.g0-evidence/ps51'
      - name: Windows PowerShell 7 harness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/Invoke-G0.ps1 -ExpectedSha (git rev-parse HEAD).Trim() -EvidenceRoot '.g0-evidence/ps7'
      - name: Verify exact candidate evidence manifests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: python -m terminan.evidence .g0-evidence --sha (git rev-parse HEAD).Trim()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/reports/identity.json
            candidate/reports/python.txt
            candidate/reports/harness-shell-*.json
            candidate/reports/r3-shell-*.json
            candidate/reports/r3-console-cancel.json
            candidate/reports/r4-shell-*.json
            candidate/reports/r4-console-cancel.json
            candidate/reports/r4-browser-evidence/
            candidate/reports/r4-browser.json
            candidate/reports/saved-browser.json
            candidate/reports/saved-invocation.txt
            candidate/reports/saved-started.txt
            candidate/reports/saved-browser-evidence/
            candidate/.r4-reliability-evidence/
            candidate/reports/r2-browser-evidence/
            candidate/reports/r3-browser-evidence/
            candidate/reports/r3-browser.json
            candidate/r3-test-results/**/r3-performance.json
            candidate/r3-test-results/**/r3-preview.png
            candidate/r3-test-results/**/error-context.md
            candidate/.g0-evidence/
            candidate/.r2-evidence/
            candidate/.r3-reliability-evidence/
          include-hidden-files: true
