name: Terminan Sync v1 contract harness
on:
  push:
    branches: [feature/terminan-sync-v1-20261106]
  pull_request:
    paths: ['terminan/sync/**', 'terminan/sync.html', 'tests/sync/**', 'docs/sync/**', '.github/workflows/terminan-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/sync/test_contract.cjs tests/sync/test_client.cjs
      - run: python -m pip install jsonschema==4.25.1
      - run: python tests/sync/validate_schema.py
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - run: npx --no-install playwright test -c tests/sync/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-windows-ui-evidence
          path: test-results/sync
